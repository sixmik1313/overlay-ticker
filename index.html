<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ticker TikTok</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    bottom: 0;
    left: 0;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  canvas.width  = 1080;
  canvas.height = 110;
  canvas.style.bottom = '0px';

  const MSG = 'Caméra Du BootCamp Entière Sur Mon Twitch : SixMikTw          ';
  const SPEED = 2.5;

  // Couleurs
  const BG        = 'rgba(8, 8, 10, 0.92)';
  const LABEL_BG  = '#E8D5A3';
  const TEXT_COL  = '#F0E6CC';
  const HIGH_COL  = '#E8D5A3';
  const BORDER    = 'rgba(232, 213, 163, 0.4)';

  const LABEL_W   = 160;
  const H         = 110;
  const FONT_SIZE = 46;
  const HIGH_WORD = 'SixMikTw';

  // Mesure la largeur du texte complet
  ctx.font = `700 ${FONT_SIZE}px Arial Narrow, Arial, sans-serif`;
  const fullW = ctx.measureText(MSG).width;

  let pos = LABEL_W + 40;

  // Dot clignotant
  let dotOn = true;
  setInterval(() => { dotOn = !dotOn; }, 700);

  function drawLabel() {
    // Fond doré
    ctx.fillStyle = LABEL_BG;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(LABEL_W + 20, 0);
    ctx.lineTo(LABEL_W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    // Dot
    ctx.beginPath();
    ctx.arc(22, H / 2, 7, 0, Math.PI * 2);
    ctx.fillStyle = dotOn ? '#0A0A0C' : 'rgba(10,10,12,0.3)';
    ctx.fill();

    // Texte label
    ctx.font = `700 20px Arial Narrow, Arial, sans-serif`;
    ctx.fillStyle = '#0A0A0C';
    ctx.letterSpacing = '3px';
    ctx.fillText('TIKTOK', 36, H / 2 + 7);
  }

  function drawTicker() {
    // Fond ticker
    ctx.fillStyle = BG;
    ctx.fillRect(LABEL_W, 0, canvas.width - LABEL_W, H);

    // Bordure top
    ctx.fillStyle = BORDER;
    ctx.fillRect(LABEL_W, 0, canvas.width - LABEL_W, 2);

    // Clip zone texte
    ctx.save();
    ctx.beginPath();
    ctx.rect(LABEL_W + 10, 0, canvas.width - LABEL_W - 10, H);
    ctx.clip();

    ctx.font = `700 ${FONT_SIZE}px Arial Narrow, Arial, sans-serif`;
    ctx.textBaseline = 'middle';

    // Dessine le message en coloriant SixMikTw différemment
    drawColoredText(MSG, pos, H / 2);

    // Loop : redessine quand le premier passe hors écran
    if (pos + fullW < canvas.width) {
      drawColoredText(MSG, pos + fullW, H / 2);
    }

    ctx.restore();
  }

  function drawColoredText(text, startX, y) {
    const parts = text.split(HIGH_WORD);
    let x = startX;
    ctx.font = `700 ${FONT_SIZE}px Arial Narrow, Arial, sans-serif`;

    parts.forEach((part, i) => {
      ctx.fillStyle = TEXT_COL;
      ctx.fillText(part, x, y);
      x += ctx.measureText(part).width;

      if (i < parts.length - 1) {
        ctx.fillStyle = HIGH_COL;
        ctx.font = `900 ${FONT_SIZE + 6}px Arial Narrow, Arial, sans-serif`;
        ctx.fillText(HIGH_WORD, x, y);
        x += ctx.measureText(HIGH_WORD).width;
        ctx.font = `700 ${FONT_SIZE}px Arial Narrow, Arial, sans-serif`;
      }
    });
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawTicker();
    drawLabel();

    pos -= SPEED;
    if (pos + fullW < LABEL_W + 10) {
      pos = canvas.width;
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
